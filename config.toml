[plugin]
enabled = false
enable_action = true
config_version = "1.0.0"

[profiles]
default_profile = "openai_default"

[profiles.items.openai_default]
display_name = "OpenAI 兼容默认套餐"
description = "适合通用文生图和按上游能力配置的图生图。"
supported_modes = ["text_to_image", "image_to_image"]
prompt_style = "natural_language"
use_cases = ["通用配图", "头像", "海报主视觉", "图片编辑"]
requires_image_source = false
action_hint = "prompt 使用自然语言描述画面，写清主体、场景、构图、光照、风格和用途；图生图时写清需要保留与修改的内容。"
provider = "openai"
base_url = "https://api.openai.com"
api_key = "sk-..."
model = "gpt-image-1"
generations_path = "/v1/images/generations"
edits_path = "/v1/images/edits"
timeout_seconds = 120

[profiles.items.openai_default.generation]
size = "1024x1024"
response_format = "b64_json"
image_to_image_mode = "multipart_edit"
json_image_field = "image"

[profiles.items.openai_default.passthrough]
enabled = false
allow_override_core_params = false
shared_params = {}
text_to_image_params = {}
image_to_image_params = {}

[behavior]
default_prompt = "Generate an image based on the current chat."
reference_image_max_age_seconds = 900
max_cached_images = 8
skip_when_busy = true
dedupe_command_action = true
command_action_dedupe_seconds = 90
allow_local_image_source = false
local_image_base_dir = "local_images"
local_image_max_bytes = 10485760
url_image_max_bytes = 10485760
allow_non_image_url_content_type = false
runtime_state_ttl_seconds = 86400
max_runtime_streams = 1024
storage_message = true
send_error_messages = false

[bot_appearance]
enabled = false
aliases = ["你", "麦麦", "MaiBot", "bot"]
trigger_phrases = ["画你", "你的头像", "你的立绘", "你的自画像", "画一下麦麦"]
inject_mode = "prepend"
tag_prompt = "1girl, solo, bot_persona"
natural_prompt = "The bot's configured character appearance."
edit_prompt = "Keep the generated character consistent with the bot's configured appearance."

[prompt]
include_context = false
context_hours = 2.0
context_message_limit = 8
context_template = """
User image request: {prompt}
Mode: {mode}
Recent chat context:
{chat_context}
Bot state: {bot_state}
Convert this into an image generation prompt only.
"""
